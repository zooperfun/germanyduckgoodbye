<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>블로그 종료 안내</title>
    <style>
      :root {
        --bg: #ffffff;
        --ink: #292522;
        --sub: #8a8078;
        --accent: #f78432;
        --line: #eee8e0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont,
          "Apple SD Gothic Neo", "Segoe UI", Roboto,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 440px;
        width: 100%;
        text-align: center;
        padding: 16px;
      }
      .logo {
        display: block;
        width: 170px;
        height: auto;
        margin: 0 auto 32px;
      }
      h1 {
        font-size: 20px;
        line-height: 1.3;
        margin: 0 0 16px;
        letter-spacing: -0.01em;
      }
      p {
        color: var(--sub);
        line-height: 1.7;
        font-size: 15px;
        margin: 0 0 16px;
      }
      p:last-of-type {
        margin-bottom: 0;
      }
      .divider {
        width: 32px;
        height: 2px;
        background: var(--accent);
        border: none;
        border-radius: 2px;
        margin: 32px auto;
      }
      .thanks {
        font-size: 15px;
        color: var(--ink);
        font-weight: 700;
      }
      footer {
        margin-top: 40px;
        font-size: 12px;
        color: var(--sub);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img
        class="logo"
        src="logo.svg"
        alt="로고"
      />
      <h1>그동안 감사했습니다</h1>
      <p>
        그동안 블로그를 찾아주시고<br />
        읽어주신 모든 분들께 깊이 감사드립니다.
      </p>
      <p>
        블로그 운영을 종료하게 되었습니다.<br />
        더 이상 새 글은 업데이트되지 않습니다.
      </p>
      <hr class="divider" />
      <p class="thanks">
        그동안 함께해 주셔서 진심으로 감사했습니다.
      </p>
    </div>
  </body>
</html>
